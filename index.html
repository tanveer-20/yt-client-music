<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rem" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Rem</title>
    <!-- Pre-warm YouTube Audio Streaming Network -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <script>
      window.onYouTubeIframeAPIReady = function() {
        window.__ytIframeReady = true;
        if (typeof window.__initYT === 'function') {
          window.__initYT();
        }
      };
    </script>
    <script id="yt-iframe-api-script" src="https://www.youtube.com/iframe_api"></script>
    <style>
      /* Prevent FOUC */
      html { background: #000; }
    </style>
  </head>
  <body class="antialiased overflow-hidden">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <!-- Dedicated audio engine container in viewport (invisible, prevents offscreen frame throttling) -->
    <div id="youtube-audio-container" style="position: fixed; bottom: 0; right: 0; width: 200px; height: 200px; opacity: 0.001; pointer-events: none; z-index: -9999;">
      <div id="youtube-audio-player"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
